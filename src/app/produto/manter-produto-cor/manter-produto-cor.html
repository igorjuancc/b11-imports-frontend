<div class="divCorIndividual">

    <div class="d-flex flex-row justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Cor</h5>

        <div class="d-flex flex-row gap-2">
            <button class="btn btn-outline-secondary btn-sm" ngbTooltip="Remover cor" (click)="removerCor()">
                <i class="bi bi-x"></i>
            </button>
        </div>
    </div>

    <div class="mb-3 row">

        <div class="col-md-6">
            <label for="corPrincipal" class="form-label">Cor Principal</label>
            <ng-select name="corPrincipal" [items]="cores" bindLabel="nome" [(ngModel)]="produtoCor.corPrincipal"
                placeholder="Selecione a cor principal" #corPrincipal="ngModel" required>
            </ng-select>

            <div *ngIf="corPrincipal.errors && (corPrincipal.dirty || corPrincipal.touched)" class="alert alert-danger">
                <div [hidden]="!corPrincipal.errors['required']"> Selecione a cor principal do produto. </div>
            </div>
        </div>


        <div class="col-md-6">
            <label for="corComplementar" class="form-label">Cores complementares</label>
            <ng-select name="corComplementar" [items]="cores" bindLabel="nome"
                [(ngModel)]="produtoCor.coresComplementares" [multiple]="true" placeholder="Cores complementares">
            </ng-select>
        </div>

    </div>

    <div class="mb-3 row">

        <div class="col-md-6">

            <label for="imagemSelecionada" class="form-label">Adicionar imagem</label>

            <div class="input-group mb-3">
                <div class="input-group">
                    <input type="file" class="form-control" aria-label="Upload" #inputImagens multiple accept="image/*"
                        (change)="0">
                    <button class="btn btn-primary" type="button" (click)="uploadImagem(inputImagens)"
                        [disabled]="!inputImagens.files || inputImagens.files.length === 0">
                        Upload
                    </button>
                </div>
            </div>

        </div>

        <div class="col-md-12">

            <div class="container-uploads" cdkDropList cdkDropListOrientation="horizontal"
                (cdkDropListDropped)="drop($event)">

                <div *ngFor="let img of produtoCor.imagens; let i = index" class="wrapper-img" cdkDrag>
                    <img [src]="img.link" class="img-upload-thumbnail">

                    <button type="button" class="btn btn-danger btn-sm position-absolute top-0 end-0 m-1"
                        (click)="removerImagem(i)" style="border-radius: 50%; padding: 2px 8px;">
                        &times;
                    </button>

                    <div class="img-placeholder" *cdkDragPlaceholder></div>
                </div>
            </div>

            <div *ngIf="produtoCor.imagens.length === 0" class="alert alert-warning mt-2">
                <div> Adicione pelo menos uma imagem para esta cor do produto. </div>
            </div>

        </div>

    </div>

    <div class="mb-3 divVariacaoProduto">
        <h5>Tamanho do Produto</h5>

        <div *ngIf="mensagensAviso.length > 0" class="alert alert-warning" role="alert">
            <ul class="mb-0">
                <li *ngFor="let mensagem of mensagensAviso">
                    {{ mensagem }}
                </li>
            </ul>
        </div>

        <div *ngFor="let variacao of produtoCor.variacoes">

            <app-variacao-produto [variacaoProduto]="variacao" [tamanhosDisponiveis]="tamanhosDisponiveis"
                (tamanhoAlterado)="handleTamanhoAlterado($event)"
                (removerVariacaoProduto)="handleRemoverVariacaoProduto($event)">
            </app-variacao-produto>

        </div>

        <div class="divBtnAddTamanho">
            <button (click)="adicionarVariacaoProduto()" type="button" class="btn btn-primary btn-sm"
                [disabled]="produtoCor.variacoes.length >= this.maxTamanhosDisponiveis">+ Adicionar Novo
                Tamanho</button>
        </div>

    </div>

</div>
