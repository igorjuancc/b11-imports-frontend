<h5>Cor</h5>

<div class="mb-3 row">

    <div class="col-md-6">
        <label for="corPrincipal" class="form-label">Cor Principal</label>
        <ng-select name="corPrincipal" [items]="cores" bindLabel="nome" [(ngModel)]="produtoCor.corPrincipal"
            placeholder="Selecione a cor principal" required>
        </ng-select>
    </div>

    <div class="col-md-6">
        <label for="corComplementar" class="form-label">Cores complementares</label>
        <ng-select name="corComplementar" [items]="cores" bindLabel="nome" [(ngModel)]="produtoCor.coresComplementares"
            [multiple]="true" placeholder="Cores complementares">
        </ng-select>
    </div>

</div>

<div class="mb-3 row">

    <div class="col-md-6">

        <label for="imagemSelecionada" class="form-label">Adicionar imagem</label>

        <div class="input-group mb-3">
            <div class="input-group">
                <input type="file" class="form-control" aria-label="Upload" #inputImagens multiple accept="image/*">
                <button class="btn btn-primary" type="button" (click)="uploadImagem(inputImagens)">
                    Upload
                </button>
            </div>
        </div>

    </div>

    <div class="col-md-12">
        <div class="container-uploads d-flex flex-wrap gap-2">

            <div *ngFor="let img of produtoCor.imagens; let i = index" class="position-relative wrapper-img">

                <img [src]="img.link" [alt]="'Imagem ' + img.ordem" class="img-upload-thumbnail">

                <button type="button" class="btn btn-danger btn-xs btn-remove" (click)="removerImagem(i)">
                    &times;
                </button>

                <span class="badge bg-dark badge-ordem">{{img.ordem}}</span>
            </div>
        </div>
    </div>


</div>

<hr />

<app-variacao-produto></app-variacao-produto>
