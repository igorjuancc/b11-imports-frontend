<div class="container">
    <h1 *ngIf="!novoProduto" class="tituloPrincipal">Editar Produto</h1>
    <h1 *ngIf="novoProduto" class="tituloPrincipal">Novo Produto</h1>


    <form #formProduto="ngForm" class="formProduto">

        <h4 class="tituloPrincipal">Dados do Produto</h4>

        <div class="mb-3 row">

            <div class="col-md-10">
                <label for="nome" class="form-label">Nome do Produto</label>
                <input name="nome" type="text" class="form-control" placeholder="Nome do Produto"
                    [(ngModel)]="produto.nome" minlength="2" required>
            </div>
            <div class="col-md-2">
                <label for="ativo" class="form-label">Habilitar Produto</label>
                <div class="form-check form-switch">
                    <input name="ativo" [(ngModel)]="produto.ativo" class="form-check-input" type="checkbox"
                        role="switch" checked>
                </div>
            </div>

        </div>

        <div class="mb-3 row">

            <div class="col-md-4">
                <label for="categoria" class="form-label">Categoria</label>
                <ng-select name="categoria" [items]="categorias" bindLabel="nome" [(ngModel)]="produto.categoria"
                    placeholder="Selecione uma categoria" required>
                </ng-select>
            </div>

            <div class="col-md-4">
                <label for="esporte" class="form-label">Esporte</label>
                <ng-select name="esporte" [items]="esportes" bindLabel="nome" [(ngModel)]="produto.esporte"
                    placeholder="Selecione o esporte">
                </ng-select>
            </div>

            <div class="col-md-4">
                <label for="lancamento" class="form-label">Data de Lançamento</label>
                <input name="lancamento" [(ngModel)]="produto.dataLancamento" type="date" class="form-control" required>
            </div>

        </div>

        <div class="mb-3 row">

            <div class="col-md-4">
                <label for="marca" class="form-label">Marca</label>
                <ng-select name="marca" [items]="marcas" bindLabel="nome" [(ngModel)]="produto.marca"
                    placeholder="Selecione uma marca" required>
                </ng-select>
            </div>

            <div class="col-md-4">
                <label for="genero" class="form-label">Genêro</label>
                <ng-select name="genero" [items]="generos" [(ngModel)]="produto.genero" placeholder="Selecione o genero"
                    required>
                </ng-select>
            </div>

            <div class="col-md-4">
                <label for="faixaEtaria" class="form-label">Perfil</label>
                <ng-select name="faixaEtaria" [items]="faixasEtarias" [(ngModel)]="produto.faixaEtaria"
                    placeholder="Selecione o perfil" required>
                </ng-select>
            </div>

        </div>

        <div class="mb-3 row">

            <div class="col-md-12">
                <label for="descricao" class="form-label">Descrição</label>
                <textarea name="descricao" [(ngModel)]="produto.descricao" class="form-control" rows="3" minlength="2"
                    required></textarea>
            </div>

        </div>

        <div class="mb-3 divCores">
            <h4 class="tituloPrincipal">Cores do Produto</h4>            

            <div *ngFor="let produtoCor of produto.produtoCores">

                <app-manter-produto-cor [produtoCor]="produtoCor">
                </app-manter-produto-cor>

            </div>

            <div class="divBtnAddCor">
                <button (click)="adicionarProdutoCor()" type="button" class="btn btn-primary">+ Adicionar Nova Cor</button>
            </div>

        </div>

    </form>

</div>
