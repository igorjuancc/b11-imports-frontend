<div class="mb-3 row">

    <div class="col-md-3">
        <label for="tamanho" class="form-label">Tamanho</label>
        <ng-select name="tamanho" [items]="tamanhosDisponiveis" bindLabel="tamanho" [(ngModel)]="variacaoProduto.tamanho"
            placeholder="Selecione o tamanho do produto" required>
        </ng-select>
    </div>

    <div class="col-md-2">
        <label for="precoOriginal" class="form-label">Preço Original</label>
        <input type="text" class="form-control" id="precoOriginal" placeholder="R$0.00">
    </div>

    <div class="col-md-2">
        <label for="precoPromocional" class="form-label">Preço Promocional</label>
        <input type="text" class="form-control" id="precoOriginal" placeholder="R$0.00">
    </div>

    <div class="col-md-2">
        <label for="estoque" class="form-label">Estoque</label>
        <input type="text" class="form-control" id="estoque" placeholder="0">
    </div>

    <div class="col-md-3">
        <label for="ativo" class="form-label">Habilitar Produto</label>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="switchCheckChecked" checked>
        </div>
    </div>

</div>
