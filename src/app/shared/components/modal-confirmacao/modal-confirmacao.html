<div class="modal-content">
    <div class="modal-header">
        <h5 class="modal-title">{{ dadosModal.titulo }}</h5>
    </div>
    <div class="modal-body">
        <p>{{ dadosModal.mensagem }}</p>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-secondary" 
        data-bs-dismiss="modal" (click)="activeModal.close()" > {{ dadosModal.textoCancelar }}</button>
        <button type="button" class="btn btn-primary"
        (click)="activeModal.close(true)" >{{ dadosModal.textoConfirmar }}</button>
    </div>
</div>
